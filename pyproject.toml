[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mllms-cloned-language"
version = "0.1.0"
description = "Original/cloned-language GPT pretraining and analysis"
requires-python = ">=3.10"

[project.scripts]
mllms = "mllms.cli:main"

[project.optional-dependencies]
book = ["jupyter-book>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mllms*"]

[tool.setuptools.package-dir]
"" = "src"
