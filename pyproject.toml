[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mllms-cloned-language"
version = "0.1.0"
description = "Original/cloned-language GPT pretraining and analysis"
requires-python = ">=3.10"
dependencies = [
  "torch==2.7.1",
  "datasets==5.0.1",
  "huggingface_hub>=0.27",
  "matplotlib==3.11.1",
  "numpy>=1.26",
  "PyYAML==6.0.2",
  "sentencepiece==0.2.2",
  "tqdm==4.70.0",
]

[project.scripts]
mllms = "mllms.cli:main"

[project.optional-dependencies]
report = ["nbformat>=5,<6", "nbconvert>=7,<8", "ipykernel>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mllms*"]

[tool.setuptools.package-dir]
"" = "src"
