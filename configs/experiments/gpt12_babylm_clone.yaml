# BabyLM supplies 100M whitespace-delimited words. SentencePiece token counts
# are measured after tokenization and recorded in data/babylm/processed.
model:
  vocab_size: 16000
  n_layers: 12
  n_heads: 8
  d_model: 512
  d_ff: 2048
  block_size: 256
  dropout: 0.1
  bias: true

data:
  data_dir: data/babylm/processed
  tokenizer_path: artifacts/babylm_tokenizer/tokenizer.model
  p_clone: 0.5

training:
  micro_batch_size: 4
  gradient_accumulation_steps: 8
  target_seen_tokens: null
  target_epochs: 2.0
  max_steps: null
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_ratio: 0.0
  warmup_steps: 500
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 500
  eval_batches: 40
  checkpoint_interval: 1000
  early_stopping_patience: null

runtime:
  device: auto
  seed: 42
  output_dir: outputs/runs/gpt12_babylm_clone
  resume: null
